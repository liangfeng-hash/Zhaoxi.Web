name: 部署到本机

on:
  push:
    branches: [ main ]
    # 前端文件类型多，用反列更稳：默认全触发，只排除确定不影响产物的
    # （正列容易漏 —— 漏了就永远不触发，且不报错）
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - '.vscode/**'
      - 'Dockerfile'            # Linux 容器部署用，跟 IIS 这条线无关
      - 'nginx.conf'            # 同上
      - '.gitignore'
      - '.gitattributes'
      - '.prettierignore'
  workflow_dispatch:      # 保留手动触发，排障时有用

concurrency:
  group: deploy-local-web
  cancel-in-progress: false

env:
  # 前端产物直接进网关的 wwwroot —— 没有独立的前端站点
  WEB_SITE:    'C:\inetpub\zhaoxi-gateway\wwwroot'
  WEB_URL:     'http://localhost'
  BACKUP_ROOT: 'C:\deploy-backup'
  # ⚠️ 关掉 git 的 fsmonitor 守护进程，否则 checkout 收尾时报 EBUSY（详见附录 A）
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: 'core.fsmonitor'
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  deploy:
    runs-on: [self-hosted, windows, local]

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        shell: pwsh
        # npm ci 严格按 package-lock.json 装，比 npm install 更适合 CI：
        # 结果可复现，且不会偷偷改 lock 文件。
        # 撞 peer 依赖冲突会直接失败，见下面第 ④ 点
        run: npm ci

      - name: 代码检查
        shell: pwsh
        # 这就是 CI 闸门：lint 不过就不发布
        run: npm run lint:check

      - name: 构建
        shell: pwsh
        run: npm run build

      - name: 备份当前站点
        shell: pwsh
        run: |
          $dest = Join-Path $env:BACKUP_ROOT "web\$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          # 备的是 wwwroot 里的前端产物，不含网关本身（网关有自己的备份步骤）
          robocopy $env:WEB_SITE $dest /E /NFL /NDL /NJH /NJS /R:2 /W:1 | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Error "备份失败"; exit 1 }
          Get-ChildItem (Join-Path $env:BACKUP_ROOT 'web') -Directory |
            Sort-Object Name -Descending | Select-Object -Skip 5 | Remove-Item -Recurse -Force
          exit 0

      - name: 同步到网关 wwwroot
        shell: pwsh
        # 纯静态文件：不用 app_offline，也不用回收应用池，覆盖完立刻生效。
        # /MIR 的镜像范围仅限 wwwroot 这个子目录，碰不到网关的 dll 和配置
        run: |
          robocopy dist $env:WEB_SITE /MIR /NFL /NDL /NJH /NJS /R:3 /W:2
          if ($LASTEXITCODE -ge 8) { Write-Error "同步失败 code=$LASTEXITCODE"; exit 1 }
          exit 0

      - name: 验证
        shell: pwsh
        run: |
          $r = Invoke-WebRequest $env:WEB_URL -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { Write-Error "前端返回 $($r.StatusCode)"; exit 1 }
          if ($r.Content -notmatch '<div id="app">') { Write-Error "页面内容异常"; exit 1 }
          Write-Host "前端页面正常"