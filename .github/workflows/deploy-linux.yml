name: 部署到 linux-C

# Actions 列表里这一行的标题。不写的话默认用 commit message，
# 而 tag 的 -m 说明不在 push 事件 payload 里，GitHub 取不到
run-name: >-
  ${{ github.ref_type == 'tag'
      && format('发布 {0}', github.ref_name)
      || format('手动构建 @ {0}', github.ref_name) }}

on:
  push:
    # ── 只有打 tag 才触发，推分支不跑这条流水线 ──
    #    发布是一个明确动作，日常提交不会碰生产
    #    lint 在 build job 里，随 tag 构建一起执行；lint 不过 → deploy 不启动
    #    注：tag 推送不受 paths 过滤影响（GitHub 对 tag 跳过路径过滤），
    #        所以这里不需要写 paths-ignore
    tags: [ 'v*' ]
  workflow_dispatch:        # 手动触发，排障或补发时用
    inputs:
      deploy:
        description: '构建后同时部署到 linux-C'
        type: boolean
        default: true

concurrency:
  group: deploy-linux-web
  cancel-in-progress: false   # 部署不可中断，排队执行

env:
  RELEASES: /var/www/releases
  LINK:     /var/www/vue
  KEEP:     5                 # 保留最近几个版本
  HOSTNAME_: fengyuan.online  # 验证时带的 Host 头

jobs:
  # ══════════════════════════════════════════════
  # 构建：跑在 GitHub 云端，不占服务器资源
  # ══════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true      # 要读 tag 的 -m 说明，必须把 tag 对象拉下来
          fetch-depth: 0        # fetch-tags 需要完整历史配合

      - name: 记录发布说明
        if: github.ref_type == 'tag'
        continue-on-error: true   # 拿不到说明不该让发布失败
        run: |
          msg=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          [ -n "$msg" ] || msg="(该 tag 没有附注说明)"
          {
            echo "## 发布 $GITHUB_REF_NAME"
            echo
            echo "$msg"
            echo
            echo "提交：\`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'          # 缓存 ~/.npm，二次构建快很多

      - name: 安装依赖
        run: npm ci             # 严格按 lock 文件，结果可复现

      - name: 代码检查
        run: npm run lint:check # CI 闸门：不过就不发布

      - name: 构建
        run: npm run build

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ══════════════════════════════════════════════
  # 部署：跑在 linux-C 的自建 runner 上
  # 不做 checkout —— 只需要产物，省掉 25KB/s 的 clone
  # ══════════════════════════════════════════════
  deploy:
    needs: build
    # 手动触发时可以只构建不部署（取消勾选 deploy）；tag 触发一律发布
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: [self-hosted, linux-c]
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: dist

      - name: 计算版本号并记录当前版本
        run: |
          set -euo pipefail
          # tag 触发时目录名用 tag（4-v1.0.0），手动触发时用短 sha（5-a1b2c3d）
          # run_number 始终在最前面，保证清理时的排序可靠
          TAG="${GITHUB_REF#refs/tags/}"
          # 注意：这里必须用 if，不能写成 [ ... ] && TAG=...
          # set -e 下条件为假会让整条语句返回 1，直接终止脚本
          if [ "$TAG" = "$GITHUB_REF" ]; then TAG="${GITHUB_SHA::7}"; fi
          TAG="${TAG//\//-}"          # tag 里若含 / 会拆出子目录，替换成 -
          echo "REL=${RELEASES}/${{ github.run_number }}-${TAG}" >> "$GITHUB_ENV"
          echo "PREV=$(readlink -f "$LINK" || echo '')" >> "$GITHUB_ENV"

      - name: 落地到新版本目录
        run: |
          set -euo pipefail
          rm -rf "$REL"
          mkdir -p "$REL"
          cp -a dist/. "$REL/"
          chmod -R a+rX "$REL"          # 保证 www-data 读得到
          touch "$REL"                  # cp -a 会把 artifact 的旧时间戳带到目录上，
                                        # 覆写成部署时刻，否则 ls -t 排序失效
          test -f "$REL/index.html"     # 产物完整性兜底

      - name: 原子切换
        run: |
          set -euo pipefail
          # ln -sfn 本身是 unlink+symlink（非原子），
          # 先建临时链再用 mv -T（rename(2)）替换才真正原子
          ln -sfn "$REL" /var/www/.vue.new
          mv -Tf /var/www/.vue.new "$LINK"
          ls -l "$LINK"

      - name: 验证
        run: |
          set -euo pipefail
          code=$(curl -sk -o /tmp/idx.html -w '%{http_code}' \
                 -H "Host: ${HOSTNAME_}" https://127.0.0.1/)
          [ "$code" = "200" ] || { echo "❌ 首页返回 $code"; exit 1; }
          grep -q '<div id="app">' /tmp/idx.html \
            || { echo "❌ 页面内容异常"; exit 1; }

          asset=$(grep -oP '(?<=src=")/assets/[^"]+\.js' /tmp/idx.html | head -1)
          [ -n "$asset" ] || { echo "❌ index.html 里找不到 assets 引用"; exit 1; }
          acode=$(curl -sk -o /dev/null -w '%{http_code}' \
                  -H "Host: ${HOSTNAME_}" "https://127.0.0.1${asset}")
          [ "$acode" = "200" ] || { echo "❌ 静态资源 $asset 返回 $acode"; exit 1; }

          echo "✅ 首页 200、内容正常、静态资源 $asset 可达"

      - name: 失败自动回滚
        if: failure()
        run: |
          set -euo pipefail
          if [ -n "${PREV:-}" ] && [ -d "$PREV" ]; then
            ln -sfn "$PREV" /var/www/.vue.new
            mv -Tf /var/www/.vue.new "$LINK"
            echo "⚠️ 已回滚到 $PREV"
          else
            echo "⚠️ 无可回滚版本，需人工介入"
          fi

      - name: 清理旧版本
        if: success()
        run: |
          set -euo pipefail
          cur=$(readlink -f "$LINK")
          # 按目录名里的 run_number 数字倒序，不用 ls -t：
          # 时间戳会因 cp -a / 重跑而失真，run_number 才是可靠的版本序
          # sort -V 保证 10 排在 3 之前（普通字典序会排反）
          # 排除 0-initial：接入流水线之前的原始站点，永久保底
          ls -1d "$RELEASES"/*/ 2>/dev/null | grep -v '/0-initial/$' | sort -t/ -k5 -Vr \
            | tail -n +$((KEEP + 1)) | while read -r d; do
                [ "$(readlink -f "$d")" = "$cur" ] && continue    # 绝不删当前版本
                rm -rf "$d" && echo "已清理 $d"
              done
          echo "当前保留："
          ls -1d "$RELEASES"/*/ | sort -t/ -k5 -Vr | head -n "$KEEP"